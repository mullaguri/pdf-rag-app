version: "3.9"

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-pdf-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_STORE_PATH=/app/vectorstore/faiss_index
    volumes:
      # Hot reload: mirror local code into container
      - .:/app
      # Persist FAISS index across container restarts
      - faiss_data:/app/vectorstore/faiss_index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/rag/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  faiss_data:
    driver: local